services:
  postgres:
    image: postgres:16-alpine
    container_name: hga-postgres
    environment:
      POSTGRES_USER: hga
      POSTGRES_PASSWORD: hga
      POSTGRES_DB: hga
    ports:
      - "5432:5432"
    volumes:
      - hga-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hga"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hga-redis
    ports:
      - "6379:6379"
    volumes:
      - hga-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hga-pg-data:
  hga-redis-data:
