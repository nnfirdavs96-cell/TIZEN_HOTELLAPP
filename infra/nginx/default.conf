server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статика ТВ-приложения. На этот адрес смотрит оболочка .wgt.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на тот же origin — чтобы приложение
    # (same-origin fetch) не упиралось в CORS и второй порт.
    # Активно, когда tv-app собран с VITE_USE_MOCKS=false (Этап 2).
    location /v1/ {
        proxy_pass http://api:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (для будущего realtime — чат/статусы заказов)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
